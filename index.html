const rand = (a, b) => a + Math.random() * (b - a);

function fbm(x, y, z) {
  return Math.sin(x * 1.7 + y * 2.3 + z * 1.1) * 0.50 +
         Math.sin(x * 3.9 - y * 1.3 + z * 2.7) * 0.28 +
         Math.sin(-x * 7.1 + y * 5.3 + z * 4.9) * 0.14 +
         Math.sin(x * 13.3 + y * 11.1 - z * 9.7) * 0.07;
}

function bone(a, b, rA, rB, mat, seg = 12) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const g = new THREE.CylinderGeometry(rB, rA, len, seg, 1, false);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return m;
}

function loft(sections, radialSeg = 22) {
  const pos = [], uv = [], idx = [];
  const M = sections.length;
  for (let j = 0; j < M; j++) {
    const s = sections[j];
    for (let i = 0; i <= radialSeg; i++) {
      const a = (i / radialSeg) * Math.PI * 2;
      pos.push(Math.cos(a) * s.rx, s.y, Math.sin(a) * s.rz + (s.cz || 0));
      uv.push(i / radialSeg, j / (M - 1));
    }
  }
  for (let j = 0; j < M - 1; j++) {
    for (let i = 0; i < radialSeg; i++) {
      const a = j * (radialSeg + 1) + i;
      const b = a + radialSeg + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

(function buildCavern() {
  const grp = new THREE.Group();

  const wallGeo = new THREE.CylinderGeometry(16, 22, 46, 64, 26, true);
  const wp = wallGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < wp.count; i++) {
    v.fromBufferAttribute(wp, i);
    const n  = fbm(v.x * 0.16, v.y * 0.11, v.z * 0.16);
    const n2 = fbm(v.x * 0.5, v.y * 0.4, v.z * 0.5) * 0.35;
    const len = Math.hypot(v.x, v.z) || 1;
    const d = (n * 2.6 + n2) * 0.5;
    wp.setX(i, v.x + (v.x / len) * d);
    wp.setZ(i, v.z + (v.z / len) * d);
    wp.setY(i, v.y + n * 0.8);
  }
  wallGeo.computeVertexNormals();
  const walls = new THREE.Mesh(wallGeo, MAT.rock);
  walls.position.y = 12;
  walls.material.side = THREE.BackSide;
  grp.add(walls);

  const gGeo = new THREE.PlaneGeometry(70, 70, 130, 130);
  gGeo.rotateX(-Math.PI / 2);
  const gp = gGeo.attributes.position;
  for (let i = 0; i < gp.count; i++) {
    const x = gp.getX(i), z = gp.getZ(i);
    const d = Math.hypot(x, z - 0.7);
    const damp = THREE.MathUtils.smoothstep(d, 1.1, 6.0);
    const h = (fbm(x * 0.42, 0, z * 0.42) * 0.20 +
               fbm(x * 0.09, 0, z * 0.09) * 0.85) * damp;
    gp.setY(i, h - 0.02);
  }
  gGeo.computeVertexNormals();
  const floor = new THREE.Mesh(gGeo, MAT.rockNear);
  floor.receiveShadow = true;
  grp.add(floor);

  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = rand(3.2, 15);
    const h = rand(0.6, 4.2);
    const g = new THREE.ConeGeometry(rand(0.35, 1.5), h, rand(5, 8), 2);
    const p = g.attributes.position;
    const vv = new THREE.Vector3();
    for (let k = 0; k < p.count; k++) {
      vv.fromBufferAttribute(p, k);
      const n = fbm(vv.x * 2.2 + i, vv.y * 1.7, vv.z * 2.2);
      p.setXYZ(k, vv.x * (1 + n * 0.35), vv.y, vv.z * (1 + n * 0.35));
    }
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, MAT.rock);
    m.position.set(Math.cos(a) * r, h * 0.5 - 0.15, Math.sin(a) * r);
    m.rotation.y = Math.random() * Math.PI;
    m.rotation.z = rand(-0.12, 0.12);
    m.scale.setScalar(rand(0.7, 1.5));
    grp.add(m);
  }
  scene.add(grp);
})();

/* ═══ 5. CHAIN SYSTEM ════════════════════════════════════════════ */
const LINK_GEO = new THREE.TorusGeometry(1.0, 0.235, 6, 14);

class ChainBuilder {
  constructor() { this.mats = []; }

  _link(pos, dir, scale, roll) {
    const d = dir.clone().normalize();
    let helper = new THREE.Vector3(0, 1, 0);
    if (Math.abs(d.dot(helper)) > 0.94) helper.set(1, 0, 0);
    const tz = new THREE.Vector3().crossVectors(d, helper).normalize();
    const tx = d.clone();
    const ty = new THREE.Vector3().crossVectors(tz, tx).normalize();
    const basis = new THREE.Matrix4().makeBasis(tx, ty, tz);
    const q = new THREE.Quaternion().setFromRotationMatrix(basis);
    if (roll) q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2));
    const M = new THREE.Matrix4()
      .makeTranslation(pos.x, pos.y, pos.z)
      .multiply(new THREE.Matrix4().makeRotationFromQuaternion(q))
      .multiply(new THREE.Matrix4().makeScale(scale, scale, scale));
    this.mats.push(M);
  }

  curve(pts, linkR) {
    const c = new THREE.CatmullRomCurve3(pts);
    const len = c.getLength();
    const n = Math.max(3, Math.round(len / (linkR * 1.42)));
    for (let i = 0; i < n; i++) {
      const t  = i / (n - 1);
      const p  = c.getPointAt(t);
      const p2 = c.getPointAt(Math.min(t + 0.03, 1));
      const dir = p2.clone().sub(p);
      if (dir.lengthSq() < 1e-9) dir.set(0, -1, 0);
      this._link(p, dir, linkR, i % 2 === 1);
    }
  }

  ring(cy, rx, rz, cx, cz, wobble, linkR, tilt) {
    const N = Math.max(10, Math.round((Math.PI * (rx + rz)) / (linkR * 1.5)));
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * Math.PI * 2;
      pts.push(new THREE.Vector3(
        Math.cos(a) * rx + (cx || 0),
        cy + Math.sin(a) * wobble,
        Math.sin(a) * rz + (cz || 0) + Math.cos(a * 2) * (tilt || 0)
      ));
    }
    this.curve(pts, linkR);
  }

  build(material) {
    if (!this.mats.length) return null;
    const mesh = new THREE.InstancedMesh(LINK_GEO, material, this.mats.length);
    this.mats.forEach((m, i) => mesh.setMatrixAt(i, m));
    mesh.instanceMatrix.needsUpdate = true;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;
    return mesh;
  }
}

const torsoMat = new THREE.ShaderMaterial({
  uniforms: torsoUniforms,
  transparent: true,
  depthWrite: false,
  side: THREE.FrontSide,
  vertexShader: /* glsl */`
    varying vec3 vLocalPos; varying vec3 vWorldNormal; varying vec3 vViewDir;
    void main() {
      vLocalPos = position;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldNormal = normalize(mat3(modelMatrix) * normal);
      vViewDir = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 uLightDir; uniform vec3 uLightColor; uniform float uTime;
    varying vec3 vLocalPos; varying vec3 vWorldNormal; varying vec3 vViewDir;
    void main() {
      vec3 N = normalize(vWorldNormal);
      vec3 V = normalize(vViewDir);
      float ndl = max(dot(N, uLightDir), 0.0);
      float ndv = max(dot(N, V), 0.0);
      float rim = pow(1.0 - ndv, 3.0);

      vec3 base = vec3(0.031, 0.034, 0.041);
      vec3 col  = base * (0.16 + 1.30 * ndl) * uLightColor;
      col += rim * vec3(0.085, 0.105, 0.145);

      vec3 q = vLocalPos - vec3(0.0, 0.45, 0.01);
      float d = length(vec3(q.x / 0.215, q.y / 0.185, q.z / 0.225));
      float win = 1.0 - smoothstep(0.52, 1.0, d);

      float pulse = 0.55 + 0.45 * sin(uTime * 1.15);
      col += win * vec3(0.175, 0.020, 0.030) * pulse;
      col += win * pow(ndv, 1.6) * vec3(0.030, 0.004, 0.010);

      float a = mix(0.965, 0.135, win);
      a = mix(a, 0.62, rim * win * 0.85);
      a = min(1.0, a + rim * 0.09);

      gl_FragColor = vec4(col, a);
    }
  `
});

};

  uniforms: shaftUniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    varying vec3 vNormalW; varying vec3 vViewDir; varying vec3 vLocalPos;
    void main() {
      vLocalPos = position;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vNormalW = normalize(mat3(modelMatrix) * normal);
      vViewDir = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime; uniform vec3 uColor; uniform float uIntensity;
    varying vec3 vNormalW; varying vec3 vViewDir; varying vec3 vLocalPos;
    void main() {
      vec3 N = normalize(vNormalW);
      vec3 V = normalize(vViewDir);
      float thick = pow(abs(dot(N, V)), 1.55);
      float hNorm = (vLocalPos.y + 4.5) / 9.0;
      float fade = smoothstep(0.02, 0.42, hNorm) * (1.0 - smoothstep(0.86, 1.0, hNorm) * 0.55);
      float n = 0.5 + 0.5 * sin(vLocalPos.y * 2.4 + uTime * 0.35 + vLocalPos.x * 1.8);
      float shimmer = 0.80 + 0.28 * n;
      float a = thick * fade * shimmer * 0.30 * uIntensity;
      gl_FragColor = vec4(uColor * a, a);
    }
  `
});

const dSpeed = new Float32Array(DUST_N);
for (let i = 0; i < DUST_N; i++) {
  const t = Math.random();
  const rMax = 0.40 + 0.95 * t;
  const r = Math.pow(Math.random(), 0.55) * rMax;
  const a = Math.random() * Math.PI * 2;
  dPos[i * 3 + 0] = Math.cos(a) * r;
  dPos[i * 3 + 1] = t * 9.0;
  dPos[i * 3 + 2] = Math.sin(a) * r;
  dSize[i]  = 0.30 + Math.random() * 1.15;
  dPhase[i] = Math.random() * Math.PI * 2;
  dSpeed[i] = 0.05 + Math.random() * 0.16;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
dustGeo.setAttribute('aSize',    new THREE.BufferAttribute(dSize, 1));
dustGeo.setAttribute('aPhase',   new THREE.BufferAttribute(dPhase, 1));
dustGeo.setAttribute('aSpeed',   new THREE.BufferAttribute(dSpeed, 1));

const dustUniforms = {
  uTime:       { value: 0 },
  uPixelRatio: { value: renderer.getPixelRatio() }
};
const dustMat = new THREE.ShaderMaterial({
  uniforms: dustUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    uniform float uTime; uniform float uPixelRatio;
    attribute float aSize; attribute float aPhase; attribute float aSpeed;
    varying float vFade;
    void main() {
      vec3 p = position;
      p.y = mod(p.y - uTime * aSpeed, 9.0);
      p.x += sin(uTime * 0.34 + aPhase) * 0.055;
      p.z += cos(uTime * 0.26 + aPhase * 1.31) * 0.055;
      vFade = smoothstep(0.0, 0.7, p.y) * (1.0 - smoothstep(7.0, 9.0, p.y));
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = aSize * uPixelRatio * 22.0 / max(-mv.z, 0.001);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    varying float vFade;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.02, d) * vFade;
      gl_FragColor = vec4(vec3(0.70, 0.80, 1.0) * a, a * 0.42);
    }
  `
});
const dust = new THREE.Points(dustGeo, dustMat);
dust.position.set(0, 0, 0.72);
dust.renderOrder = 5;
scene.add(dust);

/* ═══════════════════════════════════════════════════════════════════════
   ★★★  10. FLYING NAVIGATION ORBS  ★★★
   ─── Full circle around the seated figure, labels decorative-only ───
   ═══════════════════════════════════════════════════════════════════════ */

const labelLayer = document.getElementById('orb-labels');

function makeEmojiTexture(emoji) {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, S, S);
  ctx.font = `${S * 0.72}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, S / 2, S / 2 + S * 0.04);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function makeGlowTexture() {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.25, 'rgba(200,225,255,0.55)');
  g.addColorStop(0.60, 'rgba(120,170,240,0.20)');
  g.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  return new THREE.CanvasTexture(c);
}

const GLOW_TEX = makeGlowTexture();

function makeGlassMaterial(color) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor:     { value: new THREE.Color(color) },
      uTime:      { value: 0 },
      uIntensity: { value: 1.0 }
    },
    transparent: true,
    depthWrite: false,
    side: THREE.FrontSide,
    vertexShader: /* glsl */`
      varying vec3 vNormalV; varying vec3 vViewV;
      void main() {
        vNormalV = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vViewV = -mv.xyz;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform vec3 uColor; uniform float uTime; uniform float uIntensity;
      varying vec3 vNormalV; varying vec3 vViewV;
      void main() {
        float fres = pow(1.0 - abs(dot(normalize(vNormalV), normalize(vViewV))), 2.2);
        float pulse = 0.82 + 0.18 * sin(uTime * 1.8);
        vec3 col = uColor * (0.28 + fres * 1.9) * pulse * uIntensity;
        float alpha = 0.08 + fres * 0.65;
        gl_FragColor = vec4(col, alpha);
      }
    `
  });
}

const ORB_PALETTE = [0x7ab8ff, 0xb88bff, 0x7affc4, 0xffb86e, 0xff7abc, 0x9eff7a];

const GAMES_DIR = 'games/';   // folder that holds the game files

function navigateTo(file) {
  if (!file) return;
  let url = file;
  if (/^https?:\/\//.test(file) || file.startsWith('/') ||
      file.startsWith('./') || file.startsWith('../') ||
      file.startsWith('#') || file.startsWith('?')) {
    url = file;                                   // used as-is
  } else {
    url = file.includes('/') ? file : GAMES_DIR + file;   // bare id -> games/<id>
    if (!/\.[a-z0-9]+$/i.test(url)) url += '.html';       // add extension if missing
  }
  window.location.href = encodeURI(url);
}

const orbObjects = [];
const orbGroup = new THREE.Group();
scene.add(orbGroup);

(function buildOrbs() {
  const N = ORBS.length;
  if (N === 0) return;

  const CIRCLE_CX = 0.0;
  const CIRCLE_CZ = 1.15;

  for (let i = 0; i < N; i++) {
    const [title, emoji, desc, file] = ORBS[i];
    const color = ORB_PALETTE[i % ORB_PALETTE.length];

    const group = new THREE.Group();

    const glassMat = makeGlassMaterial(color);
    const shell = new THREE.Mesh(new THREE.SphereGeometry(0.195, 40, 28), glassMat);
    shell.renderOrder = 10;
    group.add(shell);

    const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: GLOW_TEX, color, blending: THREE.AdditiveBlending,
      transparent: true, opacity: 0.62, depthWrite: false
    }));
    glowSprite.scale.set(0.52, 0.52, 1);
    glowSprite.renderOrder = 9;
    group.add(glowSprite);

    const emojiSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeEmojiTexture(emoji),
      transparent: true, depthWrite: false, depthTest: true
    }));
    emojiSprite.scale.set(0.24, 0.24, 1);
    emojiSprite.renderOrder = 11;
    group.add(emojiSprite);

    /* Decorative-only label — no listeners, no pointer interaction */
    const label = document.createElement('div');
    label.className = 'orb-label';
    label.innerHTML = `<div class="title">${title}</div><div class="desc">${desc}</div>`;
    labelLayer.appendChild(label);

    /* Full circle layout — i = 0 starts at the front */
    const a    = (i / N) * Math.PI * 2 - Math.PI / 2;
    const tier = i % 2;
    const Rr   = 1.85 + tier * 0.25;
    const hx   = CIRCLE_CX + Math.cos(a) * Rr;
    const hz   = CIRCLE_CZ + Math.sin(a) * Rr;
    const hy   = 0.88 + tier * 0.20;

    group.position.set(hx, hy, hz);
    group.scale.setScalar(0.0);

    orbGroup.add(group);
    orbObjects.push({
      group, shell, glowSprite, emojiSprite, glassMat,
      label, file, title, emoji, desc, color,
      home: new THREE.Vector3(hx, hy, hz),
      phase: Math.random() * Math.PI * 2,
      hovered: false,
      born: performance.now()
    });
  }
})();

/* ── Orb picking (screen-space) ───────────────────────────────────────
   The old invisible hit-spheres overlapped each other (the ring is seen
   edge-on), so the nearest sphere "stole" clicks, and they did nothing on
   touch. Instead we project every orb to the screen and pick the one whose
   centre is closest to the pointer, with a generous minimum touch size.   */
const ptr = { x: -9999, y: -9999 };
let pointerInCanvas = false;
const _v = new THREE.Vector3();
const MIN_HIT_PX = 30;           // minimum clickable radius, in CSS pixels

function pickOrb(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const px = clientX - rect.left, py = clientY - rect.top;
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
  camera.updateMatrixWorld();
  let best = -1, bestScore = Infinity;
  for (let i = 0; i < orbObjects.length; i++) {
    const o = orbObjects[i];
    if (o.group.scale.x < 0.35) continue;                  // still growing in
    _v.copy(o.group.position).applyMatrix4(camera.matrixWorldInverse);
    const depth = -_v.z;
    if (depth <= 0.05) continue;                           // behind the camera
    _v.copy(o.group.position).project(camera);
    const sx = (_v.x * 0.5 + 0.5) * rect.width;
    const sy = (-_v.y * 0.5 + 0.5) * rect.height;
    const worldR = 0.26 * o.group.scale.x;
    const rPx = Math.max(MIN_HIT_PX, (worldR / (depth * tanHalf)) * (rect.height / 2));
    const d = Math.hypot(px - sx, py - sy);
    if (d > rPx) continue;
    const score = d / rPx + depth * 0.001;                 // closest to centre wins
    if (score < bestScore) { bestScore = score; best = i; }
  }
  return best;
}

renderer.domElement.addEventListener('pointermove', (e) => {
  pointerInCanvas = true;
  ptr.x = e.clientX; ptr.y = e.clientY;
});
renderer.domElement.addEventListener('pointerleave', () => {
  pointerInCanvas = false;
  ptr.x = ptr.y = -9999;
  orbObjects.forEach(o => { o.hovered = false; o.label.classList.remove('active'); });
  renderer.domElement.style.cursor = 'grab';
});

/* Click / tap — ignore drags (camera orbit) */
let downX = 0, downY = 0, downValid = false;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downX = e.clientX; downY = e.clientY; downValid = true;
  ptr.x = e.clientX; ptr.y = e.clientY;
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downValid) return;
  downValid = false;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 10) return;   // was a drag
  const idx = pickOrb(e.clientX, e.clientY);
  if (idx >= 0) navigateTo(orbObjects[idx].file);
});

/* ═══ 11. POST-PROCESSING ════════════════════════════════════════ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.82, 0.62, 0.70);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ═══ 12. RESIZE ═════════════════════════════════════════════════ */
function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  dustUniforms.uPixelRatio.value = renderer.getPixelRatio();
}
addEventListener('resize', onResize);

/* ═══ 13. ANIMATION LOOP ═════════════════════════════════════════ */
const clock = new THREE.Clock();
let firstFrame = true;

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  clock.getDelta();

  torsoUniforms.uTime.value = t;
  shaftUniforms.uTime.value = t;
  coreMat.uniforms.uTime.value = t;
  dustUniforms.uTime.value = t;

  torsoGroup.rotation.z = Math.sin(t * 0.42) * 0.006;
  torsoGroup.rotation.x = -0.42 + Math.sin(t * 0.63) * 0.005;
  head.rotation.x = -0.155 + Math.sin(t * 0.71 + 0.6) * 0.008;

  const pulse = 0.86 + 0.30 * Math.pow(Math.max(0, Math.sin(t * 1.25)), 2.4);
  heartGroup.scale.setScalar(pulse);
  heartLight.intensity = 0.62 + 0.42 * pulse;
  MAT.heart.emissiveIntensity = 0.85 + 0.45 * pulse;

  if (pointerInCanvas) {
    const idx = pickOrb(ptr.x, ptr.y);
    orbObjects.forEach((o, j) => {
      const isHover = (j === idx);
      o.hovered = isHover;
      o.label.classList.toggle('active', isHover);
    });
    renderer.domElement.style.cursor = idx >= 0 ? 'pointer' : 'grab';
  }

  const now = performance.now();
  for (let i = 0; i < orbObjects.length; i++) {
    const o = orbObjects[i];

    const age = (now - o.born) / 1000;
    const grow = Math.min(1, age / 1.2);
    const growEase = 1 - Math.pow(1 - grow, 3);

    const bob    = Math.sin(t * 0.7  + o.phase)       * 0.09;
    const drift  = Math.sin(t * 0.35 + o.phase * 1.7) * 0.06;
    const zdrift = Math.cos(t * 0.42 + o.phase * 0.9) * 0.05;

    o.group.position.set(o.home.x + drift, o.home.y + bob, o.home.z + zdrift);

    o.shell.rotation.y = t * 0.25 + o.phase;
    o.shell.rotation.x = Math.sin(t * 0.4 + o.phase) * 0.15;

    o.glassMat.uniforms.uTime.value = t;
    o.glassMat.uniforms.uIntensity.value = o.hovered ? 1.6 : 1.0;

    const hoverScale = o.hovered ? 1.20 : 1.0;
    const target = hoverScale * growEase;
    const s = o.group.scale.x + (target - o.group.scale.x) * 0.16;
    o.group.scale.setScalar(s);

    const gp = 0.55 + 0.10 * Math.sin(t * 2.0 + o.phase) + (o.hovered ? 0.18 : 0);
    o.glowSprite.material.opacity = gp;

    const labelPos = o.group.position.clone();
    labelPos.y += 0.30;
    labelPos.project(camera);

    if (labelPos.z > 1 || s < 0.05) {
      o.label.style.opacity = '0';
    } else {
      o.label.style.opacity = '1';
      const sx = ( labelPos.x * 0.5 + 0.5) * innerWidth;
      const sy = (-labelPos.y * 0.5 + 0.5) * innerHeight;
      o.label.style.left = sx + 'px';
      o.label.style.top  = sy + 'px';
    }
  }

  controls.update();
  composer.render();

  if (firstFrame) {
    firstFrame = false;
    const fade = document.getElementById('fade');
    requestAnimationFrame(() => { fade.style.opacity = '0'; });
    setTimeout(() => fade.remove(), 3400);
  }
}
animate();
</script>
