<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🌍 محاكي الحضارة الأبدي</title>
<style>
  :root {
    --bg:#090d13; --bg2:#0e141c; --panel:#121a25; --panel2:#182231;
    --line:#223044; --line2:#2f4058;
    --text:#e6ebf2; --muted:#8696ab; --dim:#5b6b80;
    --accent:#f6ad55; --accent2:#63b3ed;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior:smooth; }
  body {
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(99,179,237,.08), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, rgba(246,173,85,.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI',Tahoma,'Noto Naskh Arabic',sans-serif;
    min-height:100vh; overflow-x:hidden;
  }

  /* ───────── الشريط العلوي ───────── */
  .topbar {
    position:sticky; top:0; z-index:50;
    background:rgba(11,16,23,.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:10px 18px;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center; gap:16px;
  }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-logo {
    width:38px; height:38px; border-radius:11px;
    display:grid; place-items:center; font-size:21px;
    background:linear-gradient(135deg,#2b6cb0,#38a169);
    box-shadow:0 4px 14px rgba(56,161,105,.25), inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .brand h1 { font-size:15px; font-weight:700; color:#fff; line-height:1.2; }
  .brand small { display:block; font-size:10px; color:var(--muted); font-weight:400; margin-top:2px; }
  .back-link {
    color:var(--muted); text-decoration:none; font-size:11px;
    border:1px solid var(--line); padding:3px 9px; border-radius:20px;
    white-space:nowrap; transition:.15s;
  }
  .back-link:hover { color:#fff; border-color:var(--line2); background:var(--panel2); }

  .stats-bar { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .stat {
    display:flex; align-items:center; gap:7px;
    background:var(--panel); border:1px solid var(--line);
    padding:4px 10px 4px 12px; border-radius:10px; min-width:78px;
  }
  .stat i { font-style:normal; font-size:15px; }
  .stat div { display:flex; flex-direction:column; line-height:1.15; }
  .stat b { font-size:13px; color:#fff; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat small { font-size:9px; color:var(--dim); }

  .controls { display:flex; gap:6px; }
  .controls button {
    background:var(--panel2); color:var(--text);
    border:1px solid var(--line2); padding:7px 12px; border-radius:9px;
    cursor:pointer; font-size:11px; font-family:inherit; transition:.15s;
  }
  .controls button:hover { background:#22314a; border-color:var(--accent2); }
  .controls button:active { transform:translateY(1px); }

  /* ───────── التخطيط الرئيسي ───────── */
  .layout {
    display:grid;
    grid-template-columns:minmax(0,1fr) 340px;
    gap:14px; padding:14px 18px 24px;
    max-width:1560px; margin:0 auto;
    align-items:start;
  }
  .stage { display:flex; flex-direction:column; gap:10px; min-width:0; }

  .canvas-wrap {
    position:relative; width:fit-content; max-width:100%; margin:0 auto;
    padding:8px; border-radius:16px;
    background:linear-gradient(160deg,#1b2535,#0d131b);
    border:1px solid var(--line2);
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
  }
  #world {
    background:#0f1419; border-radius:10px; display:block;
    max-width:100%; height:auto; cursor:grab; touch-action:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.6);
  }
  #world.dragging { cursor:grabbing; }
  #world.npc-hover { cursor:pointer; }

  .legend {
    display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center; align-items:center;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:8px 14px; font-size:11px; color:var(--muted);
  }
  .legend .lg { display:flex; align-items:center; gap:5px; }
  .legend .sep { width:1px; height:14px; background:var(--line2); }
  .legend .tip { color:var(--dim); }

  aside {
    position:sticky; top:72px;
    max-height:calc(100vh - 88px);
    overflow-y:auto; padding-left:2px;
    display:flex; flex-direction:column; gap:10px;
    scrollbar-width:thin; scrollbar-color:var(--line2) transparent;
  }
  .panel {
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; overflow:hidden;
  }
  .panel > summary {
    list-style:none; cursor:pointer; user-select:none;
    padding:10px 14px; font-size:12px; font-weight:700; color:#cbd5e0;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border-bottom:1px solid transparent;
  }
  .panel > summary::-webkit-details-marker { display:none; }
  .panel > summary::after { content:'▾'; color:var(--dim); font-size:11px; transition:.2s; }
  .panel:not([open]) > summary::after { transform:rotate(90deg); }
  .panel[open] > summary { border-bottom-color:var(--line); }
  .panel-body { padding:10px; }

  /* ───────── نافذة الفحص ───────── */
  .inspect-panel {
    display:none; position:absolute;
    background:rgba(16,22,32,0.97);
    border:1px solid var(--line2);
    border-radius:14px; padding:14px;
    width:268px; max-height:80%;
    overflow-y:auto;
    box-shadow:0 14px 40px rgba(0,0,0,.65);
    font-size:12px;
    backdrop-filter:blur(6px);
    z-index:10;
  }
  .close-btn {
    position:absolute; top:8px; left:8px;
    background:transparent; border:none; color:var(--muted);
    font-size:20px; cursor:pointer; line-height:1;
    padding:0; width:24px; height:24px; border-radius:50%;
  }
  .close-btn:hover { background:var(--line2); color:#fff; }

  .ins-header { display:flex; align-items:center; gap:12px; margin-bottom:12px; padding-left:22px; }
  .ins-emoji { font-size:32px; line-height:1; }
  .portrait-box {
    flex:none; width:62px; height:62px; border-radius:12px;
    display:grid; place-items:end center; overflow:hidden;
    background:radial-gradient(circle at 50% 30%,#2a3c58,#141d2b);
    border:1px solid var(--line2);
  }
  .portrait { image-rendering:auto; display:block; }
  .ins-name { font-weight:700; font-size:14px; color:#fff; }
  .ins-sub { font-size:10px; color:var(--muted); margin-top:3px; }
  .ins-row { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:11px; color:#cbd5e0; border-bottom:1px dashed rgba(255,255,255,.05); }
  .ins-row span:first-child { width:20px; text-align:center; }
  .ins-genes { margin-top:10px; display:flex; flex-direction:column; gap:5px; }
  .gene-item { display:flex; align-items:center; gap:7px; font-size:10px; }
  .gene-bar { flex:1; height:6px; background:#1f2b3d; border-radius:4px; overflow:hidden; }
  .gene-bar > div { height:100%; border-radius:4px; }
  .gene-val { color:var(--muted); width:24px; text-align:left; font-variant-numeric:tabular-nums; }

  /* ───────── الممالك ───────── */
  .kingdom-card {
    background:linear-gradient(135deg,#17212f,#131b27);
    border:1px solid var(--line); border-right:4px solid;
    border-radius:10px; padding:9px 10px; margin-bottom:7px;
  }
  .kingdom-card:last-child { margin-bottom:0; }
  .k-head { display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-bottom:5px; }
  .k-ruler { font-size:11px; color:#ecc94b; margin-bottom:6px; }
  .k-stats { font-size:10px; color:var(--muted); display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
  .k-stats span { background:rgba(255,255,255,.04); padding:2px 4px; border-radius:5px; text-align:center; }
  .k-genes { display:flex; gap:3px; margin-top:7px; height:5px; }
  .k-genes div { flex:1; border-radius:3px; }
  .k-techs { font-size:13px; margin-top:6px; letter-spacing:1px; }
  .k-allies { font-size:10px; color:#68d391; margin-top:4px; }

  /* ───────── السجل ───────── */
  #chronicle-panel { overflow-y:auto; max-height:380px; scrollbar-width:thin; scrollbar-color:var(--line2) transparent; }
  .chron-entry { font-size:11px; line-height:1.5; padding:5px 9px; margin-bottom:4px; background:#17212f; border-radius:7px; border-right:3px solid #4a5568; color:#d4dbe6; }
  .chron-entry.war { border-right-color:#f56565; }
  .chron-entry.founding { border-right-color:#48bb78; }
  .chron-entry.collapse { border-right-color:#9f7aea; }
  .chron-entry.legend { border-right-color:#ecc94b; }
  .chron-entry.tech { border-right-color:#ed64a6; }
  .chron-entry.alliance { border-right-color:#38b2ac; }
  .chron-entry.alliance-end { border-right-color:#718096; opacity:0.7; }

  /* ───────── شجرة العائلة ───────── */
  .fam-title { font-size:11px; color:var(--muted); margin:10px 0 5px; font-weight:700; }
  .fam-row { display:flex; gap:5px; flex-wrap:wrap; }
  .fam-scroll { max-height:90px; overflow-y:auto; }
  .fam-chip {
    display:flex; align-items:center; gap:5px;
    background:#1c293c; border:1px solid var(--line);
    padding:2px 8px 2px 6px; border-radius:8px; cursor:pointer;
    font-size:10px; color:var(--text); transition:.12s;
  }
  .fam-chip:hover { background:#27395a; border-color:var(--accent2); }
  .fam-emoji { font-size:14px; display:inline-flex; align-items:flex-end; }
  .fam-age { color:var(--dim); }
  .fam-empty { color:var(--dim); font-size:10px; padding:2px 4px; }

  .gen-tree { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .gen-level { display:flex; flex-direction:column; align-items:center; }
  .gen-person {
    display:flex; align-items:center; gap:6px;
    background:#1c293c; border:1px solid var(--line);
    padding:3px 10px; border-radius:9px; cursor:pointer;
    font-size:11px; margin:2px 0; transition:.12s;
  }
  .gen-person:hover { background:#27395a; border-color:var(--accent2); }
  .gen-year { color:var(--dim); font-size:9px; }
  .gen-line { width:2px; height:9px; background:var(--line2); }

  .tree-btn {
    background:linear-gradient(135deg,#6b46c1,#553c9a); color:#fff; border:none;
    padding:7px 10px; border-radius:8px;
    cursor:pointer; font-size:11px; font-family:inherit;
    width:100%; margin-top:10px; transition:.15s;
  }
  .tree-btn:hover { filter:brightness(1.15); }

  /* ───────── استجابة ───────── */
  @media (max-width:1050px) {
    .topbar { grid-template-columns:1fr auto; }
    .stats-bar { grid-column:1 / -1; order:3; }
    .layout { grid-template-columns:minmax(0,1fr); padding:10px; }
    aside { position:static; max-height:none; overflow:visible; }
  }
  @media (max-width:520px) {
    .topbar { padding:8px 10px; }
    .stat { min-width:68px; padding:3px 8px; }
    .brand small { display:none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-logo">🌍</div>
    <div>
      <h1>محاكي الحضارة الأبدي<small>عالم مستمر</small></h1>
    </div>
    <a href="../../" class="back-link">← كل الألعاب</a>
  </div>

  <div class="stats-bar">
    <div class="stat"><i>📅</i><div><b id="s-year">—</b><small>السنة</small></div></div>
    <div class="stat"><i>👥</i><div><b id="s-pop">—</b><small>السكان</small></div></div>
    <div class="stat"><i>🧬</i><div><b id="s-gen">—</b><small>الأجيال</small></div></div>
    <div class="stat"><i>👑</i><div><b id="s-kingdoms">—</b><small>الممالك</small></div></div>
    <div class="stat"><i>🗺️</i><div><b id="s-tiles">—</b><small>الأراضي</small></div></div>
    <div class="stat"><i>⚔️</i><div><b id="s-wars">—</b><small>الحروب</small></div></div>
    <div class="stat"><i>🤝</i><div><b id="s-ally">—</b><small>التحالفات</small></div></div>
    <div class="stat"><i>🔬</i><div><b id="s-tech">—</b><small>التقنيات</small></div></div>
    <div class="stat"><i>💀</i><div><b id="s-deaths">—</b><small>الوفيات</small></div></div>
    <div class="stat"><i>🔍</i><div><b id="s-zoom">100%</b><small>التقريب</small></div></div>
  </div>

  <div class="controls">
    <button onclick="resetZoom()" title="إعادة تمركز الكاميرا">🎯 إعادة</button>
    <button onclick="manualRefresh()" title="تحديث الحالة من الخادم">🔄 تحديث</button>
  </div>
</header>

<div class="layout">
  <section class="stage">
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="world"></canvas>
      <div id="inspect-panel" class="inspect-panel"></div>
    </div>
    <div class="legend">
      <span class="lg">🌿 عشب</span><span class="lg">🌲 غابة</span><span class="lg">🌊 ماء</span>
      <span class="lg">⛰️ جبل</span><span class="lg">🌵 صحراء</span><span class="lg">🏔️ تلة</span>
      <span class="sep"></span>
      <span class="lg">🏰 عاصمة</span><span class="lg">👑 حاكم بتاج وعباءة</span>
      <span class="sep"></span>
      <span class="tip">💡 انقر شخصية أو أرضًا · كبّر بالكرة · اسحب للتنقل</span>
    </div>
  </section>

  <aside>
    <details class="panel" open>
      <summary>👑 الممالك</summary>
      <div class="panel-body"><div id="kingdoms-panel"></div></div>
    </details>
    <details class="panel" open>
      <summary>📜 سجل التاريخ</summary>
      <div class="panel-body"><div id="chronicle-panel"></div></div>
    </details>
  </aside>
</div>

<script type="module">
import {
  deserializeWorld, GENE_KEYS, TECHNOLOGIES, PALETTE, CONFIG, TERRAIN_TYPES
} from './scripts/world.js';

(function(){
'use strict';

const TILE = 12;
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');

const GENE_ICONS = { strength:'💪', intelligence:'🧠', fertility:'💕', longevity:'⏳', aggression:'😠', empathy:'🤝' };
const GENE_COLORS = { strength:'#f56565', intelligence:'#4299e1', fertility:'#ed64a6', longevity:'#9f7aea', aggression:'#ed8936', empathy:'#48bb78' };

let world = null;
let terrainCache = null;
let inspected = null;
let _lastModified = null;

const viewport = { scale: 1, offsetX: 0, offsetY: 0, minScale: 0.4, maxScale: 5 };

// ============================================================
//        تصاميم المخلوقات — 60 تصميم بكسل آرت (6 أنواع × 10)
// ============================================================
// فارس · سلايم · ذئب · شبح ضوئي · غولم · عنكبوت
// كل مخلوق يأخذ نوعه من أقوى جين فيه، وتصميمه من معرّفه.
// (دوال الرسم أدناه منقولة كما هي، مع تسمية dpx/dshade لتفادي التعارض)

function dpx(c,x,y,w,h,col){ c.fillStyle=col; c.fillRect(x,y,w,h); }

function dshade(hex,amt){
  if(!hex||hex[0]!=="#"||hex.length!==7) return hex;
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r|0));
  g=Math.max(0,Math.min(255,g|0));
  b=Math.max(0,Math.min(255,b|0));
  return "#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");
}

/* 1px Bresenham line — legs, spears, bows, spider limbs */
function legSeg(c,x1,y1,x2,y2,col){
  let dx=Math.abs(x2-x1), dy=Math.abs(y2-y1);
  const sx=x1<x2?1:-1, sy=y1<y2?1:-1;
  let err=dx-dy, guard=0;
  while(guard++<48){
    dpx(c,x1,y1,1,1,col);
    if(x1===x2&&y1===y2) break;
    const e2=2*err;
    if(e2>-dy){ err-=dy; x1+=sx; }
    if(e2<dx){ err+=dx; y1+=sy; }
  }
}

/* ------------------------------------------------------------
   HUMANOID (Knight) shared parts
------------------------------------------------------------ */
function hLegs(ctx,dir,step,L1,L2,Bo,xl,xr,w){
  xl=(xl===undefined)?4:xl; xr=(xr===undefined)?9:xr; w=(w===undefined)?3:w;
  if(dir==="side"){
    const fA=step===1?-1:step===3?1:0, fB=-fA;
    dpx(ctx,xl+fA,15,w,4,L1); dpx(ctx,xl+fA+1,15,1,4,L2); dpx(ctx,xl+fA,18,w,1,Bo);
    dpx(ctx,xr+fB,15,w,4,L1); dpx(ctx,xr+fB+1,15,1,4,L2); dpx(ctx,xr+fB,18,w,1,Bo);
  } else {
    const lT=step===1?14:15, rT=step===3?14:15;
    dpx(ctx,xl,lT,w,19-lT,L1); dpx(ctx,xl+1,lT,1,19-lT,L2); dpx(ctx,xl,18,w,1,Bo);
    dpx(ctx,xr,rT,w,19-rT,L1); dpx(ctx,xr+1,rT,1,19-rT,L2); dpx(ctx,xr,18,w,1,Bo);
  }
}

function hTorso(ctx,bob,x,w,A1,A2,A3,belt,buckle){
  dpx(ctx,x,8-bob,w,7,A1);
  dpx(ctx,x,8-bob,w,1,A2);
  dpx(ctx,x,14-bob,w,1,A3);
  if(belt){
    dpx(ctx,x+1,13-bob,w-2,1,belt);
    if(buckle) dpx(ctx,x+((w-2)>>1),13-bob,2,1,buckle);
  }
}

function hArms(ctx,dir,bob,A,Sk,xl,xr,w,h){
  xl=(xl===undefined)?2:xl; xr=(xr===undefined)?12:xr; w=(w===undefined)?2:w; h=(h===undefined)?5:h;
  if(dir==="side"){
    dpx(ctx,xl,9-bob,w,h,A); dpx(ctx,xl,13-bob,w,1,Sk);
    dpx(ctx,xr,9-bob,w,h,A); dpx(ctx,xr,13-bob,w,1,Sk);
  } else {
    dpx(ctx,xl,9-bob,w,h,A); dpx(ctx,xr,9-bob,w,h,A);
    dpx(ctx,xl,13-bob,w,1,Sk); dpx(ctx,xr,13-bob,w,1,Sk);
  }
}

function hPauldrons(ctx,bob,M1,M2,M3,xl,xr,w){
  xl=(xl===undefined)?1:xl; xr=(xr===undefined)?11:xr; w=(w===undefined)?4:w;
  dpx(ctx,xl,8-bob,w,3,M1); dpx(ctx,xr,8-bob,w,3,M1);
  dpx(ctx,xl,10-bob,w,1,M2); dpx(ctx,xr,10-bob,w,1,M2);
  dpx(ctx,xl+1,8-bob,1,1,M3); dpx(ctx,xr+w-2,8-bob,1,1,M3);
}

function capeBack(ctx,dir,step,C,C2){
  if(dir==="up"){
    dpx(ctx,2,8,12,10,C); dpx(ctx,3,16,10,2,C2); dpx(ctx,4,17,8,1,C2);
  } else if(dir==="side"){
    const f=step===1?1:0;
    dpx(ctx,0,9,3,8-f,C); dpx(ctx,0,13,2,4,C2);
  }
}

/* ---- heads ---- */
function helmRound(ctx,dir,bob,M1,M2,M3,Ey){
  dpx(ctx,5,2-bob,6,6,M1); dpx(ctx,5,2-bob,6,1,M2);
  dpx(ctx,6,4-bob,4,2,M3); dpx(ctx,5,6-bob,6,2,M2);
  if(dir==="side") dpx(ctx,9,4-bob,2,1,Ey);
  else if(dir==="down"){ dpx(ctx,7,4-bob,1,1,Ey); dpx(ctx,9,4-bob,1,1,Ey); }
}

function helmWinged(ctx,dir,bob,M1,M2,Go,Go2,Ey){
  dpx(ctx,5,2-bob,6,6,M1); dpx(ctx,5,2-bob,6,1,M2); dpx(ctx,5,7-bob,6,1,M2);
  dpx(ctx,5,4-bob,6,1,Go);
  dpx(ctx,3,2-bob,2,1,Go2); dpx(ctx,4,3-bob,1,1,Go2);
  dpx(ctx,11,2-bob,2,1,Go2); dpx(ctx,11,3-bob,1,1,Go2);
  if(dir==="side") dpx(ctx,9,5-bob,2,1,Ey);
  else if(dir==="down"){ dpx(ctx,6,5-bob,1,1,Ey); dpx(ctx,9,5-bob,1,1,Ey); }
}

function helmHorned(ctx,dir,bob,M1,M2,M3,Hn,Ey){
  dpx(ctx,5,2-bob,6,6,M1); dpx(ctx,5,2-bob,6,1,M2);
  dpx(ctx,6,4-bob,4,2,M3); dpx(ctx,5,6-bob,6,1,M2);
  dpx(ctx,3,1-bob,2,1,Hn); dpx(ctx,3,2-bob,1,1,Hn);

/* ------------------------------------------------------------
   SLIME shared parts
------------------------------------------------------------ */
const SQ=[[15,6,4],[14,5,5],[13,4,6],[14,5,5]]; /* cy,rx,ry per frame */

function slimeBlob(ctx,cx,cy,rx,ry,B,B2,Hl){
  for(let dy=-ry;dy<=ry;dy++){
    const tt=dy/ry;
    const w=Math.round(rx*Math.sqrt(Math.max(0,1-tt*tt)));
    if(w<=0) continue;
    dpx(ctx,cx-w,cy+dy,w*2,1, dy>ry*0.3?B2:B);
  }
  if(Hl){
    dpx(ctx,cx-Math.max(1,(rx*0.35)|0),cy-Math.floor(ry*0.55),2,1,Hl);
  }
}

function slimeEyes(ctx,dir,ey,E,Hl){
  let a,b;
  if(dir==="side"){ a=8; b=10; }
  else if(dir==="down"){ a=6; b=9; }
  else return;
  dpx(ctx,a,ey,1,2,E); dpx(ctx,b,ey,1,2,E);
  dpx(ctx,a,ey,1,1,Hl); dpx(ctx,b,ey,1,1,Hl);
}

/* 1. Spark — classic */
function wSpark(ctx,dir,frame,p){
  ctx.clearRect(0,0,16,20);
  const core=p.m, mid=dshade(p.m,-45), hi=dshade(p.m,75), pure=dshade(p.m,110);
  const step=frame%4;
  const bob=step===1?-1:step===3?1:0;
  const cx=8, cy=9+bob;
  wAura(ctx,cx,cy,p.t);
  dpx(ctx,cx-2,cy-2,4,4,mid);
  dpx(ctx,cx-1,cy-1,2,2,core);
  dpx(ctx,cx-1,cy-1,1,1,hi);
  dpx(ctx,cx,cy,1,1,pure);
  if(dir==="down"){ dpx(ctx,cx-1,cy,1,1,p.e); dpx(ctx,cx+1,cy,1,1,p.e); }
  else if(dir==="side"){ dpx(ctx,cx+1,cy,1,1,p.e); dpx(ctx,cx+2,cy,1,1,p.e); }
  const tOff=step===1?-1:step===3?1:0;
  dpx(ctx,cx-1+tOff,cy+4,2,1,mid);
  dpx(ctx,cx-1+tOff*2,cy+5,2,1,core);
  dpx(ctx,cx-1+tOff,cy+6,1,1,mid);
  dpx(ctx,cx-4+(step===1?1:step===3?-1:0),cy-3,1,1,hi);
  dpx(ctx,cx+4,cy+2+(step===1?1:step===3?-1:0),1,1,hi);
  dpx(ctx,cx+3,cy-4,1,1,core);
}

/* 4. Skull */
function wSkull(ctx,dir,frame,p){
  ctx.clearRect(0,0,16,20);
  const step=frame%4;
  const bob=step===1?-1:step===3?1:0;
  const cx=8, cy=9+bob;
  wAura(ctx,cx,cy,p.t);
  for(let dy=-3;dy<=3;dy++){
    const tt=dy/3.2;
    const w=Math.max(0,Math.round(3.4*Math.sqrt(Math.max(0,1-tt*tt))));
    if(w<=0) continue;
    dpx(ctx,cx-w,cy+dy,w*2,1, dy>1?"#b8c4c8":p.m);
  }
  dpx(ctx,cx-1,cy-1,1,1,"#0c1410"); dpx(ctx,cx+1,cy-1,1,1,"#0c1410");
  dpx(ctx,cx,cy,1,1,"#0c1410");

  dpx(ctx,cx,cy+1,1,1,"#0c1410");
  dpx(ctx,cx+5,cy-2+(step%2),1,1,"#a8ffc0");
  dpx(ctx,cx-6,cy+2-((step+1)%2),1,1,"#78d898");
}

/* 10. Fae */
function wFae(ctx,dir,frame,p){
  ctx.clearRect(0,0,16,20);
  const step=frame%4;
  const bob=step===1?-1:step===3?1:0;
  const cx=8, cy=9+bob;
  wAura(ctx,cx,cy,p.t);

  dpx(ctx,cx-5,wy,3,2,"#ffd0e8"); dpx(ctx,cx-4,wy+(flap?-1:1),1,1,"#ffc0e0");
  dpx(ctx,cx+3,wy,3,2,"#ffd0e8"); dpx(ctx,cx+5,wy+(flap?-1:1),1,1,"#ffc0e0");
  dpx(ctx,cx-1,cy-1,2,2,p.m);

  dpx(ctx,cx-1,cy,1,1,p.e); dpx(ctx,cx,cy,1,1,p.e);

}

/* shared golem arm/leg scaffolding */
function golemFrame(ctx,dir,step,S2,S4,D){
  const lLift=step===1?1:0, rLift=step===3?1:0;
  dpx(ctx,3,14-lLift,4,5+lLift,S2); dpx(ctx,3,18,4,1,D);
  dpx(ctx,9,14-rLift,4,5+rLift,S2); dpx(ctx,9,18,4,1,D);
  if(dir==="side"){
    dpx(ctx,0,8,3,8,S2); dpx(ctx,0,15,3,1,S4);
    dpx(ctx,13,9,3,6,S2); dpx(ctx,13,14,3,1,S4);
  } else {
    dpx(ctx,0,8,2,8,S2); dpx(ctx,0,15,2,1,S4);
    dpx(ctx,14,8,2,8,S2); dpx(ctx,14,15,2,1,S4);
  }
}

function golemHead(ctx,dir,S1,S3,E,step){
  dpx(ctx,5,3,6,4,S1);
  dpx(ctx,5,3,6,1,S3);
  dpx(ctx,5,6,6,1,S3);
  if(dir==="down"){ dpx(ctx,6,5,1,1,E); dpx(ctx,9,5,1,1,E); }
  else if(dir==="side"){ dpx(ctx,9,5,1,1,E); dpx(ctx,10,5,1,1,E); }
}

/* 1. Stone — the classic */
function gStone(ctx,dir,frame,p){
  ctx.clearRect(0,0,16,20);

  const D="#141420", step=frame%4;
  golemFrame(ctx,dir,step,S2,S4,D);
  dpx(ctx,2,7,12,8,S1);
  dpx(ctx,2,7,12,1,S3); dpx(ctx,2,14,12,1,S3);
  dpx(ctx,3,8,1,2,S2); dpx(ctx,4,9,1,1,S3);
  dpx(ctx,11,8,1,3,S2); dpx(ctx,12,11,1,2,S3);
  dpx(ctx,5,13,2,1,S3); dpx(ctx,9,12,1,1,S3);
  if(dir!=="up"){
    dpx(ctx,7,10,2,2,dshade(p.g,60));
    dpx(ctx,6,11,4,1,p.g);

  }

  if(dir!=="up"){ dpx(ctx,1,9,1,1,p.g); dpx(ctx,14,9,1,1,p.g); }
}

/* 9. Cobble — hopping pebble friend */
function gCobble(ctx,dir,frame,p){
  ctx.clearRect(0,0,16,20);
  const S1=p.m, S2=dshade(p.m,-24), S3=dshade(p.m,-44);

  dpx(ctx,2,12-hop,2,3,S2); dpx(ctx,12,12-hop,2,3,S2);
  /* round body */
  dpx(ctx,5,8-hop,6,1,S1);
  dpx(ctx,4,9-hop,8,8,S1);
  dpx(ctx,5,16-hop,6,1,S3);
  /* pebble texture */
  dpx(ctx,6,10-hop,1,1,S3); dpx(ctx,9,11-hop,1,1,dshade(p.m,28));
  dpx(ctx,5,13-hop,1,1,S3); dpx(ctx,10,13-hop,1,1,S3);
  dpx(ctx,7,14-hop,1,1,dshade(p.m,28));
  /* one big eye, blinks on frame 2 */
  if(frame%4===2){
    dpx(ctx,7,11-hop,2,2,S1);
    dpx(ctx,7,12-hop,2,1,S3);
  } else {
    dpx(ctx,7,11-hop,2,2,"#f0f4f0");
    dpx(ctx,8,12-hop,1,1,"#20242e");
    dpx(ctx,7,11-hop,1,1,"#ffffff");

/* 10. Sand — crumbling dune walker */
function gSand(ctx,dir,frame,p){
  ctx.clearRect(0,0,16,20);
  const S1=p.m, S2=dshade(p.m,-26), S3=dshade(p.m,-48);
  const D="#8a6a3a", step=frame%4;
  const lLift=step===1?1:0, rLift=step===3?1:0;
  dpx(ctx,3,14-lLift,4,5+lLift,S2); dpx(ctx,3,18,4,1,D);
  dpx(ctx,9,14-rLift,4,5+rLift,S2); dpx(ctx,9,18,4,1,D);
  if(dir==="side"){
    dpx(ctx,0,8,3,8,S2); dpx(ctx,0,15,3,1,S3);
    dpx(ctx,13,9,3,6,S2); dpx(ctx,13,14,3,1,S3);
  } else {
    dpx(ctx,0,8,2,8,S2); dpx(ctx,0,15,2,1,S3);
    dpx(ctx,14,8,2,8,S2); dpx(ctx,14,15,2,1,S3);
  }
  dpx(ctx,2,7,12,8,S1);
  dpx(ctx,2,14,12,1,S3);
  /* jagged dune top */
  if(step%2){ dpx(ctx,6,6,2,1,S1); dpx(ctx,10,6,2,1,S1); }
  else { dpx(ctx,7,6,3,1,S1); dpx(ctx,4,6,1,1,S1); }
  /* grains */
  dpx(ctx,3,9,1,1,dshade(p.m,30)); dpx(ctx,7,12,1,1,dshade(p.m,-30));
  dpx(ctx,11,9,1,1,dshade(p.m,30)); dpx(ctx,5,11,1,1,dshade(p.m,-25));
  /* hollow swirl instead of core */
  dpx(ctx,7,10,2,2,dshade(p.m,-35));
  /* head with hollow sockets */
  dpx(ctx,5,3,6,4,S1);
  dpx(ctx,5,6,6,1,S3);
  if(dir==="down"){ dpx(ctx,6,5,1,1,"#3a2a14"); dpx(ctx,9,5,1,1,"#3a2a14"); }
  else if(dir==="side"){ dpx(ctx,9,5,1,1,"#3a2a14"); dpx(ctx,10,5,1,1,"#3a2a14"); }

  dpx(ctx,7,1+(step%2),1,1,"rgba(224,200,128,.5)");
}

const RAINBOW_HUES=["#ff5a7a","#ff9a3a","#ffe03a","#5ae05a","#3aa0ff","#a05aff","#ff5aff"];

// ---------- ربط التصاميم بالمخلوقات ----------
const DS_PX = 2;            // دقة الرسم الداخلية لكل خلية
const DS_WORLD = 0.9;       // حجم الخلية في العالم
const GENE_ARCH = {         // أقوى جين ← النوع
  strength:'golem', aggression:'wolf', intelligence:'wisp',
  empathy:'slime',  longevity:'knight', fertility:'spider'
};
const designCache = new Map();

function idNum(npc) {
  const n = Number(npc.id);
  if (Number.isFinite(n)) return Math.abs(Math.floor(n));
  let h = 0; const s = String(npc.id);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

function getDesignSprite(arch, vi, dir, frame) {
  const A = ARCHETYPES[arch], dsg = A.designs[vi];
  let bucket = 0;
  if (dsg.rainbow) bucket = Math.floor(performance.now() / 180) % RAINBOW_HUES.length;
  const canon = (dir === 'left' || dir === 'right') ? 'side' : dir;
  const flip = dir === 'left';
  const key = arch + '|' + vi + '|' + bucket + '|' + canon + '|' + (flip ? 'f' : 'n') + '|' + frame;
  let c = designCache.get(key);
  if (c) return c;

  const pal = Object.assign({}, dsg.pal);
  if (dsg.rainbow) pal.m = RAINBOW_HUES[bucket];

  const nat = document.createElement('canvas');
  nat.width = 16; nat.height = 20;
  const nc = nat.getContext('2d');
  nc.imageSmoothingEnabled = false;
  dsg.draw(nc, canon, frame, pal);

  // أول صف مرسوم فعليًا (لوضع التاج فوق الرأس)
  let top = 0;
  try {
    const d = nc.getImageData(0, 0, 16, 20).data;
    outer: for (let y = 0; y < 20; y++) for (let x = 0; x < 16; x++) if (d[(y*16 + x)*4 + 3] > 60) { top = y; break outer; }
  } catch (e) {}

  c = document.createElement('canvas');
  c.width = 16 * DS_PX; c.height = 20 * DS_PX;
  const cc = c.getContext('2d');
  cc.imageSmoothingEnabled = false;
  if (flip) { cc.translate(c.width, 0); cc.scale(-1, 1); }
  cc.drawImage(nat, 0, 0, c.width, c.height);
  c._top = top;
  designCache.set(key, c);
  return c;
}

function designOf(npc) {
  if (npc._ds) return npc._ds;
  const gn = npc.genes || {};
  let best = 'strength', bv = -1;
  for (const g of Object.keys(GENE_ARCH)) {
    const v = Number(gn[g]) || 0;
    if (v > bv) { bv = v; best = g; }
  }
  const arch = GENE_ARCH[best], A = ARCHETYPES[arch];
  const vi = idNum(npc) % A.designs.length;
  return (npc._ds = { arch, vi, A, dsg: A.designs[vi] });
}

function ageScale(age) {
  return age < 3 ? 0.55 : age < 14 ? 0.72 : age < 18 ? 0.9 : age >= 55 ? 0.96 : 1;
}

function isRulerNpc(npc, k) {
  return !!(k && k.ruler && (k.ruler === npc || (k.ruler.id !== undefined && k.ruler.id === npc.id)));
}

// صورة شخصية للوحات (data URL)
function portrait(npc, width) {
  const ds = designOf(npc);
  const s = getDesignSprite(ds.arch, ds.vi, ds.A.gdir, 0);
  if (!s._url) s._url = s.toDataURL();
  return `<img class="portrait" src="${s._url}" width="${width}" alt="">`;
}

// ============================================================
//                    التضاريس — ذاكرة مؤقتة
// ============================================================
function buildTerrainCache() {
  if (!world) return;
  terrainCache = document.createElement('canvas');
  terrainCache.width = world.W * TILE;
  terrainCache.height = world.H * TILE;
  canvas.width = terrainCache.width;
  canvas.height = terrainCache.height;
  const g = terrainCache.getContext('2d');

  for (let y = 0; y < world.H; y++) {
    for (let x = 0; x < world.W; x++) {
      const info = TERRAIN_TYPES[world.terrain[y][x]];
      g.fillStyle = info.color;
      g.fillRect(x*TILE, y*TILE, TILE, TILE);
      if (Math.random() < 0.15) {
        g.fillStyle = 'rgba(255,255,255,0.04)';
        g.fillRect(x*TILE, y*TILE, TILE, TILE);
      }
    }
  }
  g.font = '9px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  for (let y = 0; y < world.H; y++) {
    for (let x = 0; x < world.W; x++) {
      if (Math.random() < 0.05) {
        const info = TERRAIN_TYPES[world.terrain[y][x]];
        if (info.decor && info.decor.length) {
          g.fillText(info.decor[Math.floor(Math.random()*info.decor.length)], x*TILE + TILE/2, y*TILE + TILE/2 + 1);
        }
      }
    }
  }
}

function drawCastle(cx, cy, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(cx, cy + 7, 9, 2.5, 0, 0, Math.PI*2); ctx.fill();

  const stone = '#9aa5b5', dark = '#6b7686';
  // جدار
  ctx.fillStyle = stone; ctx.fillRect(cx - 6, cy - 2, 12, 8);
  // برجان
  ctx.fillStyle = dark;
  ctx.fillRect(cx - 8, cy - 5, 4, 11);
  ctx.fillRect(cx + 4, cy - 5, 4, 11);
  // شرفات
  ctx.fillStyle = stone;
  for (const bx of [cx - 8, cx - 6, cx + 4, cx + 6]) ctx.fillRect(bx, cy - 7, 1.6, 2);
  ctx.fillRect(cx - 4, cy - 3.6, 1.6, 1.6); ctx.fillRect(cx - 0.8, cy - 3.6, 1.6, 1.6); ctx.fillRect(cx + 2.4, cy - 3.6, 1.6, 1.6);
  // باب بلون المملكة
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx - 2, cy + 6); ctx.lineTo(cx - 2, cy + 2.5);
  ctx.quadraticCurveTo(cx, cy + 0.5, cx + 2, cy + 2.5);
  ctx.lineTo(cx + 2, cy + 6); ctx.closePath(); ctx.fill();
  // نافذتان
  ctx.fillStyle = '#1a202c';
  ctx.fillRect(cx - 6.5, cy - 2, 1.2, 2.2); ctx.fillRect(cx + 5.3, cy - 2, 1.2, 2.2);
  // الإطار
  ctx.strokeStyle = '#11161d'; ctx.lineWidth = 1 / viewport.scale;
  ctx.strokeRect(cx - 6, cy - 2, 12, 8);
  ctx.strokeRect(cx - 8, cy - 5, 4, 11); ctx.strokeRect(cx + 4, cy - 5, 4, 11);
  // راية
  ctx.fillStyle = '#e2e8f0'; ctx.fillRect(cx - 0.4, cy - 12, 0.9, 8);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(cx + 0.5, cy - 12); ctx.lineTo(cx + 6.5, cy - 10); ctx.lineTo(cx + 0.5, cy - 8); ctx.closePath(); ctx.fill();
  ctx.stroke();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0f1419';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!world || !terrainCache) return;

  ctx.setTransform(viewport.scale, 0, 0, viewport.scale, viewport.offsetX, viewport.offsetY);
  ctx.drawImage(terrainCache, 0, 0);

  // أراضي الممالك
  for (const k of world.kingdoms) {
    if (!k.tileList || !k.tileList.length) continue;
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = k.color;
    ctx.beginPath();
    for (const { x, y } of k.tileList) ctx.rect(x*TILE, y*TILE, TILE, TILE);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // خطوط التحالفات
  for (const a of world.alliances) {
    if (a.expiresYear <= world.year) continue;
    const k1 = world.getKingdom(a.k1), k2 = world.getKingdom(a.k2);
    if (!k1 || !k2 || !k1.tileList.length || !k2.tileList.length) continue;
    const c1 = k1.tileList[0], c2 = k2.tileList[0];
    ctx.strokeStyle = '#38b2ac';
    ctx.globalAlpha = 0.5;
    ctx.setLineDash([6, 4]);
    ctx.lineWidth = 2 / viewport.scale;
    ctx.beginPath();
    ctx.moveTo(c1.x*TILE, c1.y*TILE);
    ctx.lineTo(c2.x*TILE, c2.y*TILE);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // عواصم الممالك
  for (const k of world.kingdoms) {
    if (!k.tileList.length) continue;
    const c = k.tileList[0];
    drawCastle(c.x*TILE + TILE/2, c.y*TILE + TILE/2, k.color);
  }

  // الشخصيات (مرتبة حسب العمق لتتراكب بشكل صحيح)
  const nowMs = performance.now();
  ctx.imageSmoothingEnabled = viewport.scale < 1.5;
  const alive = world.npcs.filter(n => n.alive).sort((a, b) => a.y - b.y);
  for (const npc of alive) {
    const k = world.getKingdom(npc.kingdomId);
    if (!k) continue;
    const ds = designOf(npc), A = ds.A, dsg = ds.dsg;
    const moving = Math.hypot((npc.tx ?? npc.x) - npc.x, (npc.ty ?? npc.y) - npc.y) > 2;
    const frame = moving ? Math.floor((nowMs + npc.bob * 120) / A.frameMs) % 4 : 0;
    const dirKey = npc.dir || A.gdir;
    const flt = dsg.float !== undefined ? dsg.float : !!A.float;
    const ruler = isRulerNpc(npc, k);
    const sc = ageScale(npc.age) * (ruler ? 1.12 : 1);
    const px = npc.x, py = npc.y;
    const sh = dsg.shadow || A.shadow;

    // ظل + حلقة بلون المملكة
    const srx = Math.max(2.5, sh.rx / 2 * DS_WORLD * sc);
    const sy = py + 5.5 + (sh.dy || 0) * DS_WORLD * sc;
    ctx.fillStyle = `rgba(0,0,0,${sh.alpha})`;
    ctx.beginPath(); ctx.ellipse(px, sy, srx, 2, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = k.color; ctx.globalAlpha = 0.9;
    ctx.lineWidth = 1 / Math.max(1, viewport.scale * 0.8);
    ctx.beginPath(); ctx.ellipse(px, sy, srx + 0.3, 2.2, 0, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;

    const spr = getDesignSprite(ds.arch, ds.vi, dirKey, frame);
    const dw = 16 * DS_WORLD * sc, dh = 20 * DS_WORLD * sc;
    const bob = flt ? Math.sin(nowMs / 260 + npc.bob) * 1.4 * DS_WORLD : 0;
    const dy = py + 6.5 + bob - dh;
    ctx.drawImage(spr, px - dw/2, dy, dw, dh);

    // تاج الحاكم
    if (ruler) {
      const cy = dy + (spr._top || 0) * DS_WORLD * sc - 1.3;
      ctx.fillStyle = '#f6c945';
      ctx.fillRect(px - 2.5, cy, 5, 1.4);
      ctx.fillRect(px - 2.5, cy - 1.2, 1, 1.2);
      ctx.fillRect(px - 0.5, cy - 1.7, 1, 1.7);
      ctx.fillRect(px + 1.5, cy - 1.2, 1, 1.2);
      ctx.fillStyle = '#e53e3e';
      ctx.fillRect(px - 0.5, cy + 0.2, 1, 0.8);
    }
  }
  ctx.imageSmoothingEnabled = true;

  // تمييز المفحوص
  if (inspected) {
    ctx.strokeStyle = '#f6ad55';
    ctx.lineWidth = 2 / viewport.scale;
    if (inspected.type === 'npc' && inspected.npc.alive) {
      const r = (14 + Math.sin(Date.now() / 200) * 2) / viewport.scale;
      ctx.beginPath();
      ctx.arc(inspected.npc.x, inspected.npc.y, r, 0, Math.PI*2);
      ctx.stroke();
    } else if (inspected.type === 'tile') {
      ctx.strokeRect(inspected.tx * TILE, inspected.ty * TILE, TILE, TILE);
    }
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// ============================================================
//                    التحكم في العرض
// ============================================================
function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (canvas.width / rect.width),
    y: (clientY - rect.top)  * (canvas.height / rect.height)
  };
}
function screenToWorld(sx, sy) {
  return { x: (sx - viewport.offsetX) / viewport.scale, y: (sy - viewport.offsetY) / viewport.scale };
}
function updateZoomLabel() {
  document.getElementById('s-zoom').textContent = Math.round(viewport.scale * 100) + '%';
}
function resetZoom() {
  viewport.scale = 1;
  viewport.offsetX = 0;
  viewport.offsetY = 0;
  updateZoomLabel();
}
window.resetZoom = resetZoom;

// تكبير بكرة الفأرة
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const { x: sx, y: sy } = getCanvasCoords(e.clientX, e.clientY);
  const before = screenToWorld(sx, sy);
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  viewport.scale = Math.max(viewport.minScale, Math.min(viewport.maxScale, viewport.scale * factor));
  viewport.offsetX = sx - before.x * viewport.scale;
  viewport.offsetY = sy - before.y * viewport.scale;
  updateZoomLabel();
}, { passive: false });

// تكبير بإصبعين + سحب بلمسة
let pinchState = null, touchDrag = null, dragState = null;

canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const c1 = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
    const c2 = getCanvasCoords(e.touches[1].clientX, e.touches[1].clientY);
    const cx = (c1.x + c2.x) / 2, cy = (c1.y + c2.y) / 2;
    pinchState = {
      startDist: Math.hypot(c2.x - c1.x, c2.y - c1.y),
      startScale: viewport.scale,
      anchor: screenToWorld(cx, cy),
      screenCx: cx, screenCy: cy
    };
    touchDrag = null;
  } else if (e.touches.length === 1 && !pinchState) {
    const t = e.touches[0];
    touchDrag = { startX: t.clientX, startY: t.clientY, offsetX: viewport.offsetX, offsetY: viewport.offsetY, moved: false };
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchState) {
    e.preventDefault();
    const c1 = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
    const c2 = getCanvasCoords(e.touches[1].clientX, e.touches[1].clientY);
    const dist = Math.hypot(c2.x - c1.x, c2.y - c1.y);
    viewport.scale = Math.max(viewport.minScale, Math.min(viewport.maxScale, pinchState.startScale * (dist / pinchState.startDist)));
    viewport.offsetX = pinchState.screenCx - pinchState.anchor.x * viewport.scale;
    viewport.offsetY = pinchState.screenCy - pinchState.anchor.y * viewport.scale;
    updateZoomLabel();
  } else if (e.touches.length === 1 && touchDrag && !pinchState) {
    const t = e.touches[0];
    const dx = t.clientX - touchDrag.startX, dy = t.clientY - touchDrag.startY;
    if (!touchDrag.moved && Math.hypot(dx, dy) > 6) touchDrag.moved = true;
    if (touchDrag.moved) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      viewport.offsetX = touchDrag.offsetX + dx * (canvas.width / rect.width);
      viewport.offsetY = touchDrag.offsetY + dy * (canvas.height / rect.height);
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (e.touches.length < 2) pinchState = null;
  if (touchDrag && !touchDrag.moved && e.changedTouches.length === 1) {
    const t = e.changedTouches[0];
    const { x: sx, y: sy } = getCanvasCoords(t.clientX, t.clientY);
    handleClick(sx, sy);
  }
  touchDrag = null;
});

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  dragState = { startX: e.clientX, startY: e.clientY, offsetX: viewport.offsetX, offsetY: viewport.offsetY, moved: false };
});

window.addEventListener('mousemove', e => {
  if (dragState) {
    const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
    if (!dragState.moved && Math.hypot(dx, dy) > 4) { dragState.moved = true; canvas.classList.add('dragging'); }
    if (dragState.moved) {
      const rect = canvas.getBoundingClientRect();
      viewport.offsetX = dragState.offsetX + dx * (canvas.width / rect.width);
      viewport.offsetY = dragState.offsetY + dy * (canvas.height / rect.height);
    }
  } else if (world) {
    const { x: sx, y: sy } = getCanvasCoords(e.clientX, e.clientY);
    const wp = screenToWorld(sx, sy);
    canvas.classList.toggle('npc-hover', !!findNPCAt(wp.x, wp.y));
  }
});

window.addEventListener('mouseup', e => {
  if (!dragState) return;
  const wasDrag = dragState.moved;
  canvas.classList.remove('dragging');
  dragState = null;
  if (!wasDrag && e.target === canvas) {
    const { x: sx, y: sy } = getCanvasCoords(e.clientX, e.clientY);
    handleClick(sx, sy);
  }
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
//                    النقر والفحص
// ============================================================
function findNPCAt(wx, wy) {
  if (!world) return null;
  const radius = 14 / viewport.scale;
  let nearest = null, minDist = radius;
  for (const npc of world.npcs) {
    if (!npc.alive) continue;
    const d = Math.hypot(npc.x - wx, npc.y - wy);
    if (d < minDist) { minDist = d; nearest = npc; }
  }
  return nearest;
}
function handleClick(sx, sy) {
  if (!world) return;
  const wp = screenToWorld(sx, sy);
  const npc = findNPCAt(wp.x, wp.y);
  if (npc) { showNPCInfo(npc, sx, sy); return; }
  const tx = Math.floor(wp.x / TILE), ty = Math.floor(wp.y / TILE);
  if (tx < 0 || tx >= world.W || ty < 0 || ty >= world.H) { hideInspect(); return; }
  const type = world.terrain[ty][tx];
  const ownerId = world.owner[ty][tx];
  const owner = ownerId ? world.getKingdom(ownerId) : null;
  showTileInfo(tx, ty, type, owner, sx, sy);
}

function positionPanel(sx, sy) {
  const panel = document.getElementById('inspect-panel');
  const wrap = document.getElementById('canvas-wrap');
  const wrapRect = wrap.getBoundingClientRect();
  const canvasRect = canvas.getBoundingClientRect();
  const cssX = sx * (canvasRect.width / canvas.width);
  const cssY = sy * (canvasRect.height / canvas.height);
  let left = canvasRect.left - wrapRect.left + cssX + 16;
  let top  = canvasRect.top  - wrapRect.top  + cssY + 16;
  const pw = panel.offsetWidth, ph = panel.offsetHeight;
  if (left + pw > wrapRect.width - 4) left = canvasRect.left - wrapRect.left + cssX - pw - 16;
  if (top + ph > wrapRect.height - 4) top = canvasRect.top - wrapRect.top + cssY - ph - 16;
  if (left < 4) left = 4;
  if (top < 4) top = 4;
  panel.style.transform = '';
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
}

function showNPCInfo(npc, sx, sy) {
  inspected = { type:'npc', npc };
  const k = world.getKingdom(npc.kingdomId);
  const stateText = npc.age < 16 ? 'طفل' : (npc.age >= 55 ? 'مسن' : 'بالغ');
  const sexText = npc.sex === 'M' ? 'ذكر' : 'أنثى';
  const genes = GENE_KEYS.map(g => {
    const v = Math.round(npc.genes[g]);
    return `<div class="gene-item">
      <span>${GENE_ICONS[g]}</span>
      <div class="gene-bar"><div style="width:${v}%;background:${GENE_COLORS[g]}"></div></div>
      <span class="gene-val">${v}</span>
    </div>`;
  }).join('');

  const panel = document.getElementById('inspect-panel');
  panel.innerHTML = `
    <button class="close-btn" onclick="hideInspect()">×</button>
    <div class="ins-header">
      <div class="portrait-box">${portrait(npc, 52)}</div>
      <div>
        <div class="ins-name">${npc.name}</div>
        <div class="ins-sub">${sexText} · ${stateText} · ${npc.age} سنة</div>
      </div>
    </div>
    <div class="ins-row"><span>🏰</span><span>${k ? k.name : '—'}</span></div>
    <div class="ins-row"><span>🧬</span><span>الجيل ${npc.generation}</span></div>
    <div class="ins-row"><span>❤️</span><span>الصحة ${Math.round(npc.health)}</span></div>
    <div class="ins-row"><span>⭐</span><span>الإرث ${Math.round(npc.legacy)}</span></div>
    <div class="ins-genes">${genes}</div>
    <button class="tree-btn" onclick="showFamilyTree(${npc.id})">🌳 شجرة العائلة</button>
  `;
  panel.style.display = 'block';
  positionPanel(sx, sy);
}

function showTileInfo(tx, ty, type, owner, sx, sy) {
  inspected = { type:'tile', tx, ty };
  const info = TERRAIN_TYPES[type];
  const emoji = info.decor ? info.decor[0] : '·';
  const panel = document.getElementById('inspect-panel');
  panel.innerHTML = `
    <button class="close-btn" onclick="hideInspect()">×</button>
    <div class="ins-header">
      <div class="ins-emoji">${emoji}</div>
      <div>
        <div class="ins-name">${info.ar}</div>
        <div class="ins-sub">مربع (${tx}, ${ty})</div>
      </div>
    </div>
    <div class="ins-row"><span>🌾</span><span>خصوبة ${Math.round(info.food * 100)}%</span></div>
    <div class="ins-row"><span>🚶</span><span>${info.walkable ? 'قابل للعبور' : 'غير قابل للعبور'}</span></div>
    <div class="ins-row"><span>🏰</span><span>${owner ? owner.name : 'أرض محايدة'}</span></div>
    ${owner ? `<div class="ins-row"><span>👥</span><span>سكان المملكة: ${owner.population()}</span></div>` : ''}
  `;
  panel.style.display = 'block';
  positionPanel(sx, sy);
}

function hideInspect() {
  inspected = null;
  document.getElementById('inspect-panel').style.display = 'none';
}
window.hideInspect = hideInspect;

function inspectFromTree(id) {
  const n = world.npcs.find(x => x.id === id && x.alive);
  if (n) showNPCInfo(n, canvas.width/2, canvas.height/2);
}
window.inspectFromTree = inspectFromTree;

function showFamilyTree(npcId) {
  const npc = world.npcs.find(x => x.id === npcId);
  if (!npc) return;
  const byId = id => world.npcs.find(x => x.id === id && x.alive);
  const father  = npc.parentIds?.[0] ? byId(npc.parentIds[0]) : null;
  const mother  = npc.parentIds?.[1] ? byId(npc.parentIds[1]) : null;
  const children = (npc.childIds || []).map(byId).filter(Boolean);
  const siblings = [];
  if (npc.parentIds?.length) {
    for (const pid of npc.parentIds) {
      const p = byId(pid);
      if (p) for (const cid of p.childIds) {
        if (cid !== npc.id && !siblings.find(s => s.id === cid)) {
          const s = byId(cid); if (s) siblings.push(s);
        }
      }
    }
  }
  const chip = p => p ? `<div class="fam-chip" onclick="inspectFromTree(${p.id})">
    <span class="fam-emoji">${portrait(p, 20)}</span><span>${p.name}</span><span class="fam-age">${p.age}س</span>
  </div>` : '';
  const childrenHtml = children.length ? children.map(chip).join('') : `<div class="fam-empty">لا أبناء أحياء</div>`;
  const siblingsHtml = siblings.length ? siblings.map(chip).join('') : `<div class="fam-empty">لا أشقاء</div>`;

  const panel = document.getElementById('inspect-panel');
  panel.innerHTML = `
    <button class="close-btn" onclick="hideInspect()">×</button>
    <div class="ins-header">
      <div class="portrait-box">${portrait(npc, 52)}</div>
      <div>
        <div class="ins-name">${npc.name}</div>
        <div class="ins-sub">${npc.sex==='M'?'ذكر':'أنثى'} · ${npc.age} سنة · جيل ${npc.generation}</div>
      </div>
    </div>
    <div class="fam-title">👨‍👩 الوالدان</div>
    <div class="fam-row">${chip(father) || `<div class="fam-empty">الأب: —</div>`}${chip(mother) || `<div class="fam-empty">الأم: —</div>`}</div>
    <div class="fam-title">👶 الأبناء (${children.length})</div>
    <div class="fam-row fam-scroll">${childrenHtml}</div>
    <div class="fam-title">👫 الأشقاء (${siblings.length})</div>
    <div class="fam-row fam-scroll">${siblingsHtml}</div>
    <button class="tree-btn" onclick="showGenerationTree(${npcId})">🌳 شجرة الأجيال</button>
  `;
  panel.style.display = 'block';
  panel.style.left = '50%';
  panel.style.top = '50%';
  panel.style.transform = 'translate(-50%, -50%)';
}
window.showFamilyTree = showFamilyTree;

function showGenerationTree(npcId) {
  const byId = id => world.npcs.find(x => x.id === id && x.alive);
  const npc = byId(npcId);
  if (!npc) return;
  const chain = [];
  let cur = npc;
  const seen = new Set();
  while (cur && chain.length < 6 && !seen.has(cur.id)) {
    chain.unshift(cur);
    seen.add(cur.id);
    const p1 = cur.parentIds?.[0] ? byId(cur.parentIds[0]) : null;
    const p2 = cur.parentIds?.[1] ? byId(cur.parentIds[1]) : null;
    cur = p1 || p2;
  }
  const html = chain.map((p, i) => `
    <div class="gen-level">
      <div class="gen-person" onclick="inspectFromTree(${p.id})">
        <span class="fam-emoji">${portrait(p, 22)}</span>
        <span>${p.name}</span>
        <span class="gen-year">${p.age}س · جيل ${p.generation}</span>
      </div>
    </div>
  `).join('<div class="gen-line"></div>');

  const panel = document.getElementById('inspect-panel');
  panel.innerHTML = `
    <button class="close-btn" onclick="hideInspect()">×</button>
    <div class="ins-header">
      <div class="ins-name">🌳 شجرة أجيال ${npc.name}</div>
      <div class="ins-sub">آخر 6 أجيال</div>
    </div>
    <div class="gen-tree">${html}</div>
    <button class="tree-btn" onclick="showFamilyTree(${npcId})">← العودة للعائلة</button>
  `;
  panel.style.display = 'block';
  panel.style.left = '50%';
  panel.style.top = '50%';
  panel.style.transform = 'translate(-50%, -50%)';
}
window.showGenerationTree = showGenerationTree;

// ============================================================
//                    جلب العالم من الخادم
// ============================================================
const WORLD_JSON_URL = 'https://raw.githubusercontent.com/Anas68755/purr/main/games/civilization/public/world.json';

async function fetchWorld() {
  try {
    const res = await fetch(`${WORLD_JSON_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) return false;
    _lastModified = res.headers.get('last-modified') || String(Date.now());
    const data = await res.json();
    if (!data || typeof data.year !== 'number') return false;
    world = deserializeWorld(data);
    // أعطِ كل NPC موضعًا مرئيًا مبدئيًا
    for (const n of world.npcs) {
      if (n.x === 0 && n.y === 0) {
        const k = world.getKingdom(n.kingdomId);
        if (k && k.tileList.length) {
          const t = k.tileList[Math.floor(Math.random()*k.tileList.length)];
          n.x = t.x*TILE + TILE/2; n.y = t.y*TILE + TILE/2;
          n.tx = n.x; n.ty = n.y;
        }
      }
      n.bob = Math.random() * Math.PI * 2;
    }
    buildTerrainCache();
    if (inspected?.type === 'npc' && !inspected.npc.alive) hideInspect();
    return true;
  } catch (e) {
    return false;
  }
}

async function manualRefresh() {
  if (await fetchWorld()) renderUI();
}
window.manualRefresh = manualRefresh;

async function startViewer() {
  if (!await fetchWorld()) {
    setTimeout(startViewer, 5000);
    return;
  }
  updateZoomLabel();
  renderUI();
  requestAnimationFrame(loop);

  // فحص دوري كل 60 ثانية
  setInterval(async () => {
    if (document.hidden) return;
    try {
      const res = await fetch(`${WORLD_JSON_URL}?t=${Date.now()}`, { method: 'HEAD', cache: 'no-store' });
      const lm = res.headers.get('last-modified');
      if (lm && lm !== _lastModified) {
        if (await fetchWorld()) renderUI();
      }
    } catch (e) { /* تجاهل */ }
  }, 60_000);
}

// ============================================================
//                    حركة الشخصيات المرئية
// ============================================================
function pickTarget(npc) {
  const k = world.getKingdom(npc.kingdomId);
  if (!k || !k.tileList.length) return;
  const tile = k.tileList[Math.floor(Math.random() * k.tileList.length)];
  npc.tx = tile.x * TILE + TILE/2 + (Math.random()-0.5) * 6;
  npc.ty = tile.y * TILE + TILE/2 + (Math.random()-0.5) * 6;
}

function updateVisuals(dt) {
  if (!world) return;
  for (const npc of world.npcs) {
    if (!npc.alive) continue;
    npc.bob += dt * 3;
    const dx = npc.tx - npc.x, dy = npc.ty - npc.y;
    const d = Math.hypot(dx, dy);
    if (d > 2) {
      const speed = (npc.age < 14 ? 35 : 25) * dt;
      npc.x += (dx/d) * Math.min(d, speed);
      npc.y += (dy/d) * Math.min(d, speed);
      if (Math.abs(dx) > 0.5) npc.face = dx < 0 ? -1 : 1;
      npc.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    } else {
      pickTarget(npc);
    }
  }
}

// ============================================================
//                    الحلقة الرئيسية
// ============================================================
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  updateVisuals(dt);
  render();
  requestAnimationFrame(loop);
}

startViewer();

})();
</script>
