<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Not Available Yet</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;background:#000;overflow:hidden;
    overscroll-behavior:none;touch-action:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
  }
  canvas{display:block;width:100%;height:100%}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 78% 68% at 50% 44%,
      rgba(0,0,0,0) 28%, rgba(0,0,0,.5) 72%, rgba(0,0,0,.92) 100%);}
  #loader{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:#000;color:#7f9ec4;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.5em;text-transform:uppercase;transition:opacity 1.2s ease;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  #loader.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="loader">Descending&nbsp;…</div>
<div id="vig"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FontLoader }     from 'three/addons/loaders/FontLoader.js';
import { TextGeometry }   from 'three/addons/geometries/TextGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';

/* ------------------------------------------------------------------ *
 *  DEVICE DETECTION  → quality tiers
 * ------------------------------------------------------------------ */
const isMobile = (() => {
  try {
    return window.matchMedia('(pointer: coarse)').matches ||
           Math.min(innerWidth, innerHeight) < 700;
  } catch (e) {
    return innerWidth < 820;
  }
})();

const DPR          = Math.min(window.devicePixelRatio || 1, isMobile ? 1.6 : 2);
const CAVE_SEG     = isMobile ? 76  : 110;
const CAVE_RINGS   = isMobile ? 48  : 70;
const DUST_N       = isMobile ? 360 : 800;
const SPIKES_DOWN  = isMobile ? 34  : 52;
const SPIKES_UP    = isMobile ? 30  : 46;

/* ------------------------------------------------------------------ *
 *  VALUE NOISE
 * ------------------------------------------------------------------ */
const hash = (x, y, z) => {
  const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return s - Math.floor(s);
};
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const w = zf * zf * (3 - 2 * zf);
  const L = (a, b, t) => a + (b - a) * t;
  const c000 = hash(xi,     yi,     zi    ), c100 = hash(xi + 1, yi,     zi    );
  const c010 = hash(xi,     yi + 1, zi    ), c110 = hash(xi + 1, yi + 1, zi    );
  const c001 = hash(xi,     yi,     zi + 1), c101 = hash(xi + 1, yi,     zi + 1);
  const c011 = hash(xi,     yi + 1, zi + 1), c111 = hash(xi + 1, yi + 1, zi + 1);
  return L(
    L(L(c000, c100, u), L(c010, c110, u), v),
    L(L(c001, c101, u), L(c011, c111, u), v), w
  );
}
function fbm(x, y, z) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { s += a * noise3(x * f, y * f, z * f); f *= 2.03; a *= 0.5; }
  return s;
}

/* ------------------------------------------------------------------ *
 *  RENDERER / SCENE
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.fog    = new THREE.FogExp2(0x04060a, 0.021);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 3.4, 14.5);

/* ------------------------------------------------------------------ *
 *  THE CAVE  (inverted, noise-displaced ellipsoid)
 * ------------------------------------------------------------------ */
const CAVE_R = 22;
const caveGeo = new THREE.SphereGeometry(CAVE_R, CAVE_SEG, CAVE_RINGS);
{
  const pos = caveGeo.attributes.position;
  const v = new THREE.Vector3();
  const n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    n.copy(v).normalize();
    const big   = fbm(n.x * 2.1,          n.y * 2.1,          n.z * 2.1);
    const small = fbm(n.x * 7.5 + 13.2,   n.y * 7.5 + 4.1,    n.z * 7.5 + 9.7);
    const d = (big - 0.5) * 5.5 + (small - 0.5) * 2.0;
    v.copy(n).multiplyScalar(CAVE_R + d);
    pos.setXYZ(i, v.x, v.y * 0.8, v.z);
  }
  caveGeo.computeVertexNormals();
}
const caveMat = new THREE.MeshStandardMaterial({
  color: 0x3b332b, roughness: 1.0, metalness: 0.0,
  side: THREE.BackSide, flatShading: true
});
scene.add(new THREE.Mesh(caveGeo, caveMat));

/* ------------------------------------------------------------------ *
 *  STALACTITES / STALAGMITES
 * ------------------------------------------------------------------ */
const spikeMat = new THREE.MeshStandardMaterial({
  color: 0x2b241e, roughness: 1.0, metalness: 0.0, flatShading: true
});
function addSpikes(count, up) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 5.5 + Math.random() * 14.5;
    const shell = 0.8 * Math.sqrt(Math.max(0, CAVE_R * CAVE_R - r * r)) * 0.86;
    const h  = 0.8 + Math.random() * Math.random() * 9.5;
    const rd = 0.18 + Math.random() * 1.15;
    const geo = new THREE.ConeGeometry(rd, h, 5 + ((Math.random() * 3) | 0), 1);
    const m = new THREE.Mesh(geo, spikeMat);
    const tilt = () => (Math.random() - 0.5) * 0.16;
    if (up) {
      m.position.set(Math.cos(a) * r, -shell + h / 2 - 0.6, Math.sin(a) * r);
      m.rotation.set(tilt(), Math.random() * 6.28, tilt());
    } else {
      m.position.set(Math.cos(a) * r,  shell - h / 2 + 0.6, Math.sin(a) * r);
      m.rotation.set(Math.PI + tilt(), Math.random() * 6.28, tilt());
    }
    scene.add(m);
  }
}
addSpikes(SPIKES_UP, true);      // stalagmites
addSpikes(SPIKES_DOWN, false);   // stalactites

/* ------------------------------------------------------------------ *
 *  LIGHTING
 * ------------------------------------------------------------------ */
scene.add(new THREE.HemisphereLight(0x1b2c44, 0x080604, 1.1));

const spot = new THREE.SpotLight(0xcfe4ff, 1700, 90, 0.34, 0.85, 2.0);
spot.position.set(0, 21, 0);
spot.target.position.set(0, 0, 0);
scene.add(spot, spot.target);

const fill = new THREE.PointLight(0x5f8fd8, 45, 34, 2.0);
fill.position.set(0, 4.5, 3);
scene.add(fill);

/* ------------------------------------------------------------------ *
 *  LIGHT SHAFT (custom volumetric-look cone)
 * ------------------------------------------------------------------ */
const shaftMat = new THREE.ShaderMaterial({
  uniforms: {
    uColor:    { value: new THREE.Color(0xa9c9ff) },
    uStrength: { value: 0.42 }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    varying vec3 vN;
    varying vec3 vV;
    void main() {
      vUv = uv;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vN = normalize(mat3(modelMatrix) * normal);
      vV = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    precision mediump float;
    uniform vec3  uColor;
    uniform float uStrength;
    varying vec2 vUv;
    varying vec3 vN;
    varying vec3 vV;
    void main() {
      float f    = 1.0 - abs(dot(normalize(vN), normalize(vV)));
      float rim  = pow(f, 2.0);
      float body = mix(0.20, 1.0, rim);
      float vert = smoothstep(0.0, 0.55, vUv.y);
      float a    = body * vert * uStrength;
      gl_FragColor = vec4(uColor * a, a);
    }`,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide
});
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 9.0, 26, isMobile ? 32 : 48, 1, true), shaftMat);
shaft.position.y = 6;
scene.add(shaft);

/* ------------------------------------------------------------------ *
 *  SOFT DOT TEXTURE (dust + ceiling glow)
 * ------------------------------------------------------------------ */
function makeDotTexture() {
  const s = isMobile ? 48 : 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(205,228,255,0.75)');
  g.addColorStop(1.00, 'rgba(150,195,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const dotTex = makeDotTexture();

const holeGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: dotTex, color: 0xcfe4ff, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.9
}));
holeGlow.position.set(0, 19.2, 0);
holeGlow.scale.setScalar(7);
scene.add(holeGlow);

/* ------------------------------------------------------------------ *
 *  DUST MOTES
 * ------------------------------------------------------------------ */
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(DUST_N * 3), 3));
const dust = [];
for (let i = 0; i < DUST_N; i++) {
  dust.push({
    a:  Math.random() * Math.PI * 2,
    r:  Math.sqrt(Math.random()) * 7.5,
    y:  -9 + Math.random() * 30,
    sp: 0.18 + Math.random() * 0.75,
    ph: Math.random() * Math.PI * 2,
    sw: (Math.random() - 0.5) * 0.14
  });
}
const dustPoints = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  size: isMobile ? 0.16 : 0.135, map: dotTex, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending, color: 0xb6d2ff, opacity: 0.85,
  sizeAttenuation: true
}));
scene.add(dustPoints);

/* ------------------------------------------------------------------ *
 *  THE TEXT
 * ------------------------------------------------------------------ */
const TEXT_BASE_W = 9.4;            // normalized world width of the text
const textGroup = new THREE.Group();
textGroup.position.set(0, 2.4, 0);
scene.add(textGroup);

const textMat = new THREE.MeshStandardMaterial({
  color: 0xe6f0ff,
  emissive: 0x6f9ee0,
  emissiveIntensity: 1.15,
  roughness: 0.28,
  metalness: 0.35
});

function addFallbackText() {
  const cv = document.createElement('canvas');
  cv.width  = isMobile ? 1536 : 2048;
  cv.height = isMobile ? 384  : 512;
  const ctx = cv.getContext('2d');
  const fs  = cv.height * 0.37;
  ctx.font = `700 ${fs}px Helvetica, Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#eaf2ff';
  ctx.shadowColor = '#7fb0ff';
  ctx.shadowBlur = 44;
  ctx.fillText('Not Available Yet', cv.width / 2, cv.height / 2);
  ctx.fillText('Not Available Yet', cv.width / 2, cv.height / 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(TEXT_BASE_W, TEXT_BASE_W * (cv.height / cv.width)),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
  );
  textGroup.add(mesh);
}

new FontLoader().load(
  'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
  (font) => {
    const geo = new TextGeometry('Not Available Yet', {
      font,
      size: 1.0,
      height: 0.26,
      depth: 0.26,
      curveSegments: isMobile ? 4 : 6,
      bevelEnabled: true,
      bevelThickness: 0.035,
      bevelSize: 0.028,
      bevelSegments: isMobile ? 2 : 3
    });
    geo.center();
    geo.computeBoundingBox();

    const mesh = new THREE.Mesh(geo, textMat);
    const w = geo.boundingBox.max.x - geo.boundingBox.min.x;
    mesh.scale.setScalar(TEXT_BASE_W / w);
    textGroup.add(mesh);
  },
  undefined,
  () => addFallbackText()
);

/* ------------------------------------------------------------------ *
 *  POST PROCESSING
 * ------------------------------------------------------------------ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  isMobile ? 0.55 : 0.62,   // strength
  0.55,                     // radius
  0.78                      // threshold
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ------------------------------------------------------------------ *
 *  RESPONSIVE CAMERA FIT  (the key piece for phone ⇄ pc)
 * ------------------------------------------------------------------ */
let camDist = 14.5;

function fitView() {
  const w = Math.max(innerWidth, 1);
  const h = Math.max(innerHeight, 1);
  const aspect = w / h;
  const portrait = aspect < 1.05;

  // narrower screens get a wider FOV so the text still fits comfortably
  camera.fov    = portrait ? 64 : 50;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();

  // keep the camera comfortably inside the cave on every aspect ratio
  camDist = portrait ? 13.5 : 14.5;

  // scale the text so it never overflows the visible width
  const tanV     = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const visibleW = 2 * camDist * tanV * aspect;
  const targetW  = Math.min(TEXT_BASE_W, visibleW * 0.72);
  textGroup.scale.setScalar(targetW / TEXT_BASE_W);
}

fitView();

/* ------------------------------------------------------------------ *
 *  RESIZE  (window, orientation, and mobile address-bar changes)
 * ------------------------------------------------------------------ */
let resizeQueued = false;
function onResize() {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h);
    composer.setSize(w, h);
    bloom.setSize(w, h);
    fitView();
  });
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 250));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onResize);
}

/* ------------------------------------------------------------------ *
 *  ANIMATION
 * ------------------------------------------------------------------ */
const clock = new THREE.Clock();
const posAttr = dustGeo.attributes.position;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;

  /* slow drifting camera (kept inside the cave) */
  const ang = Math.sin(t * 0.11) * 0.40;
  camera.position.set(
    Math.sin(ang) * camDist,
    3.5 + Math.sin(t * 0.45) * 0.35,
    Math.cos(ang) * camDist
  );
  camera.lookAt(0, 2.4, 0);

  /* floating text */
  textGroup.position.y = 2.4 + Math.sin(t * 0.8) * 0.13;
  textGroup.rotation.y = Math.sin(t * 0.34) * 0.13;
  textGroup.rotation.z = Math.sin(t * 0.62) * 0.016;

  /* breath of the light */
  spot.intensity = 1700 + Math.sin(t * 1.7) * 90 + Math.sin(t * 0.53) * 130;
  holeGlow.material.opacity = 0.85 + Math.sin(t * 1.3) * 0.10;
  holeGlow.scale.setScalar(7 + Math.sin(t * 0.9) * 0.35);

  /* dust */
  for (let i = 0; i < DUST_N; i++) {
    const d = dust[i];
    d.y -= d.sp * dt;
    if (d.y < -9) d.y = 21;
    const a  = d.a + t * d.sw;
    const rr = d.r + Math.sin(t * 0.6 + d.ph) * 0.45;
    posAttr.setXYZ(i, Math.cos(a) * rr, d.y, Math.sin(a) * rr);
  }
  posAttr.needsUpdate = true;

  composer.render();
}

renderer.setAnimationLoop(animate);

/* hide loader once things are rolling */
setTimeout(() => document.getElementById('loader').classList.add('hide'), 550);
</script>
</body>
</html>
